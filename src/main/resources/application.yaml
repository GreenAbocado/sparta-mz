spring:
  application:
    name: commerce
  profiles:
    active: dev

server:
  servlet:
    session:
      timeout: 30m # 기본 30m, 명시적 처리를 위해 기재
      cookie:
        http-only: true # JS 쿠키 참조 방지
        secure: true  # 현재 운영용, 로컬에선 변경 필요
        same-site: lax # 쿠키 단계에서의 CSRF 방어 (lax= Get은 다른 도메인 사이트여도 허용)

---
server:
  servlet:
    session:
      cookie:
        secure: false # 개발 환경만 HTTP 허용

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/schedule_develop
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: create